[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter-free-redundancy-elimination"
version = "0.1.0"
description = "Parameter-free fine-tuning of vision foundation models through feature-channel redundancy elimination"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Jiahuan Long"},
  {name = "Tingsong Jiang"},
  {name = "Wen Yao"},
  {name = "Yizhe Xiong"},
  {name = "Zhengqin Xu"},
  {name = "Shuai Jia"},
  {name = "Hanqing Liu"},
  {name = "Chao Ma"},
]
keywords = ["SAM", "SAM2", "parameter-free fine-tuning", "segmentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=9.5",
  "torch>=2.1",
]

[project.optional-dependencies]
sam = [
  "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git@6fdee8f2727f4506cfbbe553e23b895e27956588",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
pfft-re = "redundancy_elimination.cli:main"

[project.urls]
Repository = "https://github.com/Jiahuan-Long/parameter-free-finetuning"
Issues = "https://github.com/Jiahuan-Long/parameter-free-finetuning/issues"
Paper = "https://doi.org/10.1609/aaai.v40i28.39581"
Preprint = "https://arxiv.org/abs/2504.08915"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
